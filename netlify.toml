# Netlify yapılandırması — proje valdori-studio/ alt klasöründedir.
# Next.js çalışma zamanı (OpenNext adaptörü) Netlify tarafından otomatik algılanır.
[build]
  base = "valdori-studio"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js çalışma zamanı: yükleme (zip/API) dağıtımlarında otomatik eklenmediği için açıkça tanımlanır.
[[plugins]]
  package = "@netlify/plugin-nextjs"
